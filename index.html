<!DOCTYPE html>
<html>
<head>
  <title>Translator with Definitions</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      background: #4CAF50;
      color: white;
      padding: 20px;
      margin: 40px auto;
      width: 400px;
      border-radius: 10px;
    }

    textarea, select, button {
      width: 90%;
      margin: 6px;
      padding: 8px;
    }

    textarea {
      height: 80px;
    }

    #output {
      background: white;
      color: black;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

<h1>🌐 Translator + Dictionary</h1>

<div class="box">

  <textarea id="inputText" placeholder="Enter word or sentence"></textarea>

  <select id="fromLang">
    <option value="auto">Auto Detect</option>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="kn">Kannada</option>
    <option value="ta">Tamil</option>
  </select>

  <select id="toLang">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="kn">Kannada</option>
    <option value="ta">Tamil</option>
  </select>

  <button onclick="processText()">Translate + Definition</button>
  <button onclick="copyText()">Copy</button>

  <div id="output">Result will appear here...</div>

</div>

<script>
async function processText() {
  let text = document.getElementById("inputText").value;
  let from = document.getElementById("fromLang").value;
  let to = document.getElementById("toLang").value;

  if (text.trim() === "") {
    alert("Enter text!");
    return;
  }

  try {
    // 🔹 Step 1: Translate
    let transUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    let transRes = await fetch(transUrl);
    let transData = await transRes.json();

    let translated = transData.responseData.translatedText;

    let definitionHTML = "<b>Definition:</b> Not available";

    // 🔹 Step 2: Dictionary (only if English word)
    if (to === "en") {
      try {
        let dictUrl = `https://api.dictionaryapi.dev/api/v2/entries/en/${translated}`;
        let dictRes = await fetch(dictUrl);
        let dictData = await dictRes.json();

        let meaning = dictData[0].meanings[0];
        let def = meaning.definitions[0].definition;
        let example = meaning.definitions[0].example || "No example";
        let part = meaning.partOfSpeech;

        definitionHTML =
          "<b>Part of Speech:</b> " + part + "<br><br>" +
          "<b>Definition:</b> " + def + "<br><br>" +
          "<b>Example:</b> " + example;

      } catch {
        definitionHTML = "<b>Definition:</b> Not found";
      }
    }

    // 🔹 Display
    document.getElementById("output").innerHTML =
      "<b>Original:</b> " + text + "<br><br>" +
      "<b>Translated:</b> " + translated + "<br><br>" +
      definitionHTML;

  } catch {
    document.getElementById("output").innerText = "Error!";
  }
}

// Copy
function copyText() {
  let text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>

</body>
</html>
